name: Windows

# feifei's private build: builds the Tauri shell in win/ on a real Windows runner and, on main,
# publishes the installer as KeyCat-feifei-Setup.exe on the feifei-windows release. Each push
# replaces that release, so its download link never changes. The build takes no updates
# (PRIVATE in win/src/main.rs), so nothing is signed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: the build runs npm and cargo dependencies, so only the release job,
# which runs nothing but gh, may write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: win

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      # Named apart from the official KeyCat-Windows-Setup.exe, so the two cannot be mixed up.
      - name: Collect the installer
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe out/KeyCat-feifei-Setup.exe
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keycat-windows
          path: win/out/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: keycat-windows
          path: out

      - name: Publish the feifei-windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          gh release delete feifei-windows --cleanup-tag --yes || true
          gh release create feifei-windows out/KeyCat-feifei-Setup.exe --target "$GITHUB_SHA" --latest \
            --title "feifei 版 Windows 安装包" \
            --notes "feifei 私人版，由 ${GITHUB_SHA::7} 打包。下载 KeyCat-feifei-Setup.exe 安装；装好后菜单最下面会显示「feifei 私人版」，「外观 → 毛色」里有 feifei。"
